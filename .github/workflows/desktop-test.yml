name: Desktop app

# The Rust checks of the desktop app (apps/desktop), only when it changes. macOS runners have the
# web view libraries that Tauri compiles against, so the job installs no system packages.

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-test.yml
  push:
    branches: [staging]
    paths:
      - apps/desktop/**

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --features e2e -- -D warnings

      - name: Test
        run: cargo test
