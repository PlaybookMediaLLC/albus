[package]
name = "quills-desktop"
version = "0.1.0"
description = "The Quills desktop app: a native shell for the Quills web app"
edition = "2021"
publish = false

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
url = "2"

[features]
# Test hooks for e2e/run.mjs only. Release builds never enable it.
e2e = []

[profile.release]
codegen-units = 1
lto = true
strip = true
